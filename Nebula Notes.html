<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Nebula Notes</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Unbounded:wght@300;500;700&family=Hanken+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{--bg:#0a0c24;--panel:rgba(255,255,255,.055);--line:rgba(180,190,255,.16);--ink:#eef0ff;--mute:#9aa1d4;--a:#8f82ff;--b:#5be6ff;--c:#ff7eb9;--glow:rgba(143,130,255,.35);
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:light){:root:not([data-theme="dark"]){--bg:#eef0ff;--panel:rgba(255,255,255,.7);--line:rgba(60,60,140,.18);--ink:#16183a;--mute:#5a5f94;--a:#5b4bf0;--b:#0a9fc4;--c:#d6246f;--glow:rgba(91,75,240,.25)}}
:root[data-theme="light"]{--bg:#eef0ff;--panel:rgba(255,255,255,.7);--line:rgba(60,60,140,.18);--ink:#16183a;--mute:#5a5f94;--a:#5b4bf0;--b:#0a9fc4;--c:#d6246f;--glow:rgba(91,75,240,.25)}
:root[data-theme="dark"]{--bg:#0a0c24;--panel:rgba(255,255,255,.055);--line:rgba(180,190,255,.16);--ink:#eef0ff;--mute:#9aa1d4;--a:#8f82ff;--b:#5be6ff;--c:#ff7eb9;--glow:rgba(143,130,255,.35)}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px);scroll-behavior:smooth}
body{margin:0;background:var(--bg);color:var(--ink);font:400 1.02rem/1.65 "Hanken Grotesk",system-ui,sans-serif;min-height:100%;overflow-x:hidden}
#sky{position:fixed;inset:0;width:100%;height:100%;z-index:0}
.wrap{position:relative;z-index:1;max-width:1080px;margin:0 auto;padding:0 20px}
nav{display:flex;justify-content:space-between;align-items:center;padding:22px 0}
.logo{font:700 1.05rem "Unbounded",sans-serif;letter-spacing:.02em}
.logo i{display:inline-block;width:12px;height:12px;border-radius:50%;background:conic-gradient(var(--a),var(--b),var(--c),var(--a));margin-right:10px;box-shadow:0 0 14px var(--glow)}
.row{display:flex;gap:10px;align-items:center}
button{font:inherit;color:inherit;cursor:pointer}
:focus-visible{outline:2px solid var(--b);outline-offset:3px}
.btn{border:1px solid var(--line);background:var(--panel);padding:9px 16px;border-radius:999px;backdrop-filter:blur(12px);transition:border-color .2s,box-shadow .2s}
.btn:hover{border-color:var(--b);box-shadow:0 0 18px var(--glow)}
.btn.main{background:linear-gradient(120deg,var(--a),var(--b));color:#06081e;border:0;font-weight:600}
.hero{padding:9vh 0 6vh;max-width:760px}
h1{font:700 clamp(2.3rem,7vw,4.6rem)/1.04 "Unbounded",sans-serif;margin:0 0 22px;letter-spacing:-.02em}
h1 span{background:linear-gradient(100deg,var(--a),var(--b) 55%,var(--c));-webkit-background-clip:text;background-clip:text;color:transparent}
.hero p{color:var(--mute);font-size:1.15rem;max-width:560px;margin:0 0 28px}
.tools{display:flex;flex-wrap:wrap;gap:12px;align-items:center;margin:10px 0 26px}
.search{flex:1 1 220px;border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:11px 18px;border-radius:999px;font:inherit;backdrop-filter:blur(12px)}
.search::placeholder{color:var(--mute)}
.tags{display:flex;gap:8px;flex-wrap:wrap}
.tag{border:1px solid var(--line);background:transparent;padding:6px 14px;border-radius:999px;color:var(--mute);font-size:.9rem}
.tag[aria-pressed="true"]{color:var(--ink);border-color:var(--a);background:var(--glow)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:18px;padding-bottom:70px}
.card{text-align:left;border:1px solid var(--line);background:var(--panel);backdrop-filter:blur(14px);border-radius:22px;padding:24px;display:flex;flex-direction:column;gap:12px;position:relative;overflow:hidden;transition:transform .25s,border-color .25s}
.card::before{content:"";position:absolute;inset:0;background:radial-gradient(240px circle at var(--mx,50%) var(--my,0%),var(--glow),transparent 70%);opacity:0;transition:opacity .3s}
.card:hover{transform:translateY(-4px);border-color:var(--a)}
.card:hover::before{opacity:1}
.card>*{position:relative}
.card.lead{grid-column:1/-1}
.card h2{font:500 1.2rem/1.3 "Unbounded",sans-serif;margin:0}
.card.lead h2{font-size:clamp(1.4rem,3.4vw,2rem)}
.card p{margin:0;color:var(--mute)}
.meta{display:flex;justify-content:space-between;font-size:.86rem;color:var(--mute);margin-top:auto}
.chip{color:var(--b);font-weight:600}
.empty{grid-column:1/-1;text-align:center;color:var(--mute);padding:50px 0}
dialog{border:1px solid var(--line);background:var(--bg);color:var(--ink);border-radius:26px;padding:0;width:min(680px,92vw);max-height:88vh;box-shadow:0 0 80px var(--glow)}
dialog::backdrop{background:rgba(5,6,20,.6);backdrop-filter:blur(6px)}
.pad{padding:30px;overflow:auto;max-height:86vh}
.pad h2{font:700 clamp(1.4rem,4vw,2rem)/1.2 "Unbounded",sans-serif;margin:8px 0 14px}
.body{max-width:62ch;white-space:pre-wrap}
form label{display:block;margin:14px 0 6px;color:var(--mute);font-size:.92rem}
form input,form select,form textarea{width:100%;border:1px solid var(--line);background:var(--panel);color:var(--ink);border-radius:14px;padding:11px 14px;font:inherit}
form textarea{min-height:170px;resize:vertical}
.like[aria-pressed="true"]{border-color:var(--c);color:var(--c)}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translate(-50%,30px);opacity:0;background:var(--a);color:#06081e;padding:10px 20px;border-radius:999px;font-weight:600;z-index:9;transition:.3s;pointer-events:none}
.toast.on{opacity:1;transform:translate(-50%,0)}
footer{position:relative;z-index:1;text-align:center;color:var(--mute);padding:30px 20px 50px;font-size:.9rem}
@media(prefers-reduced-motion:reduce){*{transition:none!important;scroll-behavior:auto!important}}
</style>
</head>
<body>
<canvas id="sky" aria-hidden="true"></canvas>
<div class="wrap">
  <nav>
    <div class="logo"><i></i>Nebula Notes</div>
    <div class="row">
      <button class="btn" id="theme" aria-label="Switch theme">Theme</button>
      <button class="btn main" id="write">Write a post</button>
    </div>
  </nav>
  <header class="hero">
    <h1>Stories from the <span>edge of what's next.</span></h1>
    <p>A student-run journal on code, campus life and the ideas that keep us up past midnight. Read a post or publish your own.</p>
  </header>
  <div class="tools">
    <input class="search" id="q" type="search" placeholder="Search posts" aria-label="Search posts">
    <div class="tags" id="tags" role="group" aria-label="Filter by topic"></div>
  </div>
  <main class="grid" id="grid"></main>
</div>
<footer>Posts you write are saved in this browser only.</footer>

<dialog id="reader"><div class="pad" id="readerBody"></div></dialog>
<dialog id="composer"><div class="pad">
  <h2>New post</h2>
  <form id="form">
    <label for="t">Title</label><input id="t" required maxlength="90">
    <label for="g">Topic</label>
    <select id="g"><option>Tech</option><option>Campus</option><option>Career</option><option>Ideas</option></select>
    <label for="b">Your story</label><textarea id="b" required></textarea>
    <div class="row" style="margin-top:18px;justify-content:flex-end">
      <button type="button" class="btn" id="cancel">Cancel</button>
      <button class="btn main">Publish</button>
    </div>
  </form>
</div></dialog>
<div class="toast" id="toast" role="status"></div>

<script>
const seed=[
{id:1,t:"What I learned shipping my first real project",g:"Tech",a:"Aarav",d:"Oct 2",b:"My final-year idea started as a weekend script. It became a real app only when I let one friend use it and watched them get confused.\n\nThree lessons: ship small, write down decisions, and treat bugs as feedback rather than failure. A tiny working version beats a perfect plan every time.",l:24},
{id:2,t:"Surviving placement season without losing yourself",g:"Career",a:"Meera",d:"Sep 28",b:"Placement prep can swallow everything. I split my day into three blocks: practice, projects and rest. Rest was not optional.\n\nMock interviews with friends helped more than another hour of solo problem solving.",l:41},
{id:3,t:"Night walks and the best ideas",g:"Ideas",a:"Kabir",d:"Sep 21",b:"Some of my cleanest thinking happens on the hostel road at 11pm, away from screens. If you are stuck, move your body and let your brain wander.",l:18},
{id:4,t:"A beginner's map of AI tools for students",g:"Tech",a:"Isha",d:"Sep 15",b:"Use AI to explain, not to replace your thinking. Ask it to quiz you, to critique your draft, or to explain a concept two different ways.\n\nThen close the tab and try the problem yourself.",l:57},
{id:5,t:"Why the college fest taught me more than class",g:"Campus",a:"Rohan",d:"Sep 9",b:"Running a fest team meant budgets, deadlines and people who disagree. None of it was in the syllabus, all of it mattered.",l:33}];
let posts,liked,tag="All",q="";
const S={get(k,d){try{const v=localStorage.getItem(k);return v?JSON.parse(v):d}catch(e){return d}},set(k,v){try{localStorage.setItem(k,JSON.stringify(v))}catch(e){}}};
posts=S.get("nn_posts",seed);liked=S.get("nn_liked",[]);
const $=id=>document.getElementById(id);
function toast(m){const t=$("toast");t.textContent=m;t.classList.add("on");setTimeout(()=>t.classList.remove("on"),1800)}
function mins(b){return Math.max(1,Math.round(b.split(/\s+/).length/200))}
function renderTags(){const all=["All",...new Set(posts.map(p=>p.g))];const box=$("tags");box.innerHTML="";
 all.forEach(n=>{const x=document.createElement("button");x.className="tag";x.textContent=n;x.setAttribute("aria-pressed",n===tag);x.onclick=()=>{tag=n;renderTags();render()};box.appendChild(x)})}
function render(){const g=$("grid");g.innerHTML="";
 const list=posts.filter(p=>(tag==="All"||p.g===tag)&&(p.t+p.b).toLowerCase().includes(q.toLowerCase()));
 if(!list.length){g.innerHTML='<div class="empty">No posts match yet. Try another word or write one yourself.</div>';return}
 list.forEach((p,i)=>{const c=document.createElement("button");c.className="card"+(i===0&&!q&&tag==="All"?" lead":"");
  c.innerHTML='<span class="chip"></span><h2></h2><p></p><div class="meta"><span></span><span></span></div>';
  c.children[0].textContent=p.g;c.children[1].textContent=p.t;c.children[2].textContent=p.b.split("\n")[0].slice(0,140)+(p.b.length>140?"...":"");
  c.children[3].children[0].textContent=p.a+" · "+p.d;c.children[3].children[1].textContent=mins(p.b)+" min read · "+p.l+" likes";
  c.onclick=()=>open(p.id);
  c.onpointermove=e=>{const r=c.getBoundingClientRect();c.style.setProperty("--mx",(e.clientX-r.left)+"px");c.style.setProperty("--my",(e.clientY-r.top)+"px")};
  g.appendChild(c)})}
function open(id){const p=posts.find(x=>x.id===id);const r=$("readerBody");r.innerHTML='<span class="chip"></span><h2></h2><div class="meta" style="margin-bottom:18px"><span></span></div><div class="body"></div><div class="row" style="margin-top:24px;justify-content:space-between"><button class="btn like"></button><button class="btn" id="close">Close</button></div>';
 r.children[0].textContent=p.g;r.children[1].textContent=p.t;r.children[2].children[0].textContent=p.a+" · "+p.d+" · "+mins(p.b)+" min read";r.children[3].textContent=p.b;
 const lb=r.querySelector(".like");const paint=()=>{const on=liked.includes(id);lb.setAttribute("aria-pressed",on);lb.textContent=(on?"Liked · ":"Like · ")+p.l};paint();
 lb.onclick=()=>{if(liked.includes(id)){liked=liked.filter(x=>x!==id);p.l--}else{liked.push(id);p.l++}S.set("nn_liked",liked);S.set("nn_posts",posts);paint();render()};
 r.querySelector("#close").onclick=()=>$("reader").close();$("reader").showModal()}
$("q").oninput=e=>{q=e.target.value;render()};
$("write").onclick=()=>$("composer").showModal();
$("cancel").onclick=()=>$("composer").close();
$("form").onsubmit=e=>{e.preventDefault();const d=new Date();
 posts.unshift({id:Date.now(),t:$("t").value.trim(),g:$("g").value,a:"You",d:d.toLocaleDateString("en",{month:"short",day:"numeric"}),b:$("b").value.trim(),l:0});
 S.set("nn_posts",posts);e.target.reset();$("composer").close();tag="All";renderTags();render();toast("Published");window.scrollTo({top:300,behavior:"smooth"})};
["reader","composer"].forEach(i=>$(i).addEventListener("click",e=>{if(e.target.id===i)e.target.close()}));
$("theme").onclick=()=>{const h=document.documentElement;const dark=h.dataset.theme?h.dataset.theme==="dark":!matchMedia("(prefers-color-scheme:light)").matches;h.dataset.theme=dark?"light":"dark";S.set("nn_theme",h.dataset.theme)};
const th=S.get("nn_theme",null);if(th)document.documentElement.dataset.theme=th;
renderTags();render();

/* Constellation background */
const cv=$("sky"),cx=cv.getContext("2d");let W,H,N=[],m={x:-999,y:-999};
const still=matchMedia("(prefers-reduced-motion:reduce)").matches;
function size(){W=cv.width=innerWidth;H=cv.height=innerHeight;N=Array.from({length:Math.min(90,Math.floor(W*H/14000))},()=>({x:Math.random()*W,y:Math.random()*H,vx:(Math.random()-.5)*.3,vy:(Math.random()-.5)*.3}))}
addEventListener("resize",size);addEventListener("pointermove",e=>{m.x=e.clientX;m.y=e.clientY});size();
function col(n){return getComputedStyle(document.documentElement).getPropertyValue(n).trim()}
function frame(){cx.clearRect(0,0,W,H);const a=col("--a"),b=col("--b");
 N.forEach(p=>{if(!still){p.x+=p.vx;p.y+=p.vy;if(p.x<0||p.x>W)p.vx*=-1;if(p.y<0||p.y>H)p.vy*=-1;
  const dx=m.x-p.x,dy=m.y-p.y,d=Math.hypot(dx,dy);if(d<160){p.x+=dx*.012;p.y+=dy*.012}}
  cx.fillStyle=a;cx.globalAlpha=.8;cx.beginPath();cx.arc(p.x,p.y,1.6,0,7);cx.fill()});
 for(let i=0;i<N.length;i++)for(let j=i+1;j<N.length;j++){const d=Math.hypot(N[i].x-N[j].x,N[i].y-N[j].y);
  if(d<120){cx.globalAlpha=(1-d/120)*.35;cx.strokeStyle=b;cx.beginPath();cx.moveTo(N[i].x,N[i].y);cx.lineTo(N[j].x,N[j].y);cx.stroke()}}
 for(const p of N){const d=Math.hypot(m.x-p.x,m.y-p.y);if(d<170){cx.globalAlpha=(1-d/170)*.7;cx.strokeStyle=col("--c");cx.beginPath();cx.moveTo(m.x,m.y);cx.lineTo(p.x,p.y);cx.stroke()}}
 if(!still)requestAnimationFrame(frame)}
frame();
</script>
</body>
</html>
